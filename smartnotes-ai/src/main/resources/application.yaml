server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

spring:
  application:
    name: smartnotes-ai
  mvc:
    async:
      request-timeout: -1   # no timeout — SSE streams stay alive until job finishes
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:7b-instruct-q4_K_M
          temperature: 0.3

smartnotes:
  workspace: ${user.home}/smartnotes-workspace
  whisper:
    url: http://localhost:8001
  ollama:
    url: http://localhost:11434
    text-model: qwen2.5:7b-instruct-q4_K_M
    vision-model: minicpm-v:8b-2.6-q4_0
    embed-model: nomic-embed-text
  excalidraw:
    mcp-command: npx
    mcp-args: excalidraw-mcp
  frames:
    interval-seconds: 30
  ytdlp:
    binary: yt-dlp
  ffmpeg:
    binary: ffmpeg

logging:
  level:
    com.smartnotes_ai: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %highlight(%-5level) [%X{jobId:--}/%X{videoId:--}] %cyan(%-35logger{35}) - %msg%n"